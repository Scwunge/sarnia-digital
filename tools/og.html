<!doctype html>
<!-- The 1200x630 share card (site/img/og.jpg). tools/render-images.cjs loads this with the flag
     sprite inlined and screenshots it. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Archivo"; src: url("../site/fonts/Archivo-100-900.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Plex Mono"; src: url("../site/fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #F3EFE4; color: #0F1A2E; font-family: "Archivo"; position: relative; overflow: hidden; }
.line { position: absolute; left: 0; right: 0; top: 92px; height: 3px; background: #0F1A2E; }
.flags { position: absolute; left: 80px; top: 70px; display: flex; gap: 14px; }
.flags div { position: relative; padding-top: 32px; }
.flags div::before { content: ""; position: absolute; left: 50%; top: 22px; width: 3px; height: 12px; background: #0F1A2E; }
.flags svg { width: 118px; height: 94px; display: block; }
h1 { position: absolute; left: 76px; top: 262px; margin: 0; font-size: 116px; line-height: .9; font-weight: 900; font-stretch: 118%; letter-spacing: -.045em; }
h1 span { display: block; color: #D8322A; }
.url { position: absolute; left: 80px; bottom: 44px; font: 500 22px "Plex Mono"; letter-spacing: .12em; color: #3A4455; }
.where { position: absolute; right: 80px; bottom: 44px; font: 500 22px "Plex Mono"; letter-spacing: .12em; color: #6A7180; }
</style></head><body>
<!--SPRITE-->
<div class="line"></div>
<div class="flags">
  <div><svg viewBox="0 0 50 40"><use href="#flag-S"/></svg></div><div><svg viewBox="0 0 50 40"><use href="#flag-A"/></svg></div>
  <div><svg viewBox="0 0 50 40"><use href="#flag-R"/></svg></div><div><svg viewBox="0 0 50 40"><use href="#flag-N"/></svg></div>
  <div><svg viewBox="0 0 50 40"><use href="#flag-I"/></svg></div><div><svg viewBox="0 0 50 40"><use href="#flag-A"/></svg></div>
</div>
<h1>Small island.<span>Big signal.</span></h1>
<div class="url">SARNIA.DIGITAL</div>
<div class="where">WEB STUDIO · GUERNSEY</div>
</body></html>
